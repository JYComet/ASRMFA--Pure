# 新版合成英文数据 — strict-en-mfa-v4.0，fresh acoustic rerun 模式。
#
# 运行前必须先执行 scripts/prepare_hecheng_english_ctc_ready.py prepare 和
# finalize。禁止使用 --force 或 --overwrite；canary/full 均使用 fresh run root
# 与 --no-output-staging。strict 审核通过后，才可由人工执行版本化发布。

mode: ctc_ready

# 固定、一次性的生产 run 根目录；准备工具会拒绝已存在的目标。
data_dir: /mnt/nvme3/mfa_runs/hecheng_english/20260806_strict_v4_0/audio_view
workspace: /mnt/nvme3/mfa_runs/hecheng_english/20260806_strict_v4_0/workspace_full
nvme_cache: ""                         # 禁止使用 84,788 条来源混杂的旧 cache
disable_nvme_cache: true                # strict runner 不执行自动探测/替换
use_cache: false
temp_dir: temp                          # 相对 workspace

ctc_ready:
  authoritative_source_dir: /mnt/Raw/新版合成英文数据
  source_dictionary: /mnt/local_E/MFA_Pause/repo/dict/mfa_ipa.dict
  ctc_dir: /mnt/nvme3/mfa_runs/hecheng_english/20260806_strict_v4_0/ctc_ready
  text_dir: /mnt/nvme3/mfa_runs/hecheng_english/20260806_strict_v4_0/reference_view
  require_all: true
  isolate_copy: true
  expected_count: 53998
  require_fresh_workspace: true
  verify_timeout: 14400
  expected_ready_evidence:
    path: /mnt/nvme3/mfa_runs/hecheng_english/20260806_strict_v4_0/ctc_ready_evidence.json
    sha256: REPLACE_AFTER_FINALIZE
    taxonomy_sha256: REPLACE_AFTER_FINALIZE
    schema: hecheng-english-ctc-ready-v4
    state: ready
    independent_verifier_signature: ctc-ready-independent-v1

# 只作为版本发布根目录；strict run 不直接写这里。
output_dir: /mnt/Raw/新版合成英文数据对齐
output_staging: false
keep_16k_audio: true

models_dir: /mnt/local_E/MFA_Pause/repo/models/mfa
mfa_dict: /mnt/nvme3/mfa_runs/hecheng_english/20260806_strict_v4_0/dict/mfa_ipa.dict
runtime_mfa_dict: runtime/mfa_ipa.dict

pad_silence:
  enabled: false                       # v4 final axis 固定为 authoritative_wav

ctc_adjust:
  enabled: true
  limit: 0

mfa:
  num_jobs: 64
  single_speaker: true
  output_format: long_textgrid
  clean: false
  no_tokenization: true
  skip_validate: true
  fine_tune: false
  beam: 20
  retry_beam: 80
  timeout: 7200

mfa_en:
  enabled: true
  strict_provenance: true
  timeout: 7200
  g2p_timeout: 600
  num_jobs: 16
  normalize_workers: 32
  corpus_workers: 16
  padding_ms: 50
  min_segment_dur_ms: 200
  max_gap_merge_s: 0.35
  beam: 10
  retry_beam: 40
  fine_tune: false
  acoustic_model: /mnt/local_E/MFA_Pause/pretrained_models/acoustic/english_us_arpa.zip
  dictionary: dict/cmudict.dict
  g2p_model: /mnt/local_E/MFA_Pause/pretrained_models/g2p/english_us_arpa.zip

postprocess:
  strict_ok: true
  merge_silence: true
  min_sil_merge_sec: 0.2
  fix_short_word: false
  detect_bgm: true
  filter_suspicious: true
  enable_text_correction: true
  handle_unexpected_sil: true

output_spec:
  align: ["aligned/*.TextGrid"]
  align_en:
    - "en_phones/en_alignment_manifest.json"
  postprocess:
    - "output/*.TextGrid"
    - "output/tone_mapping.json"
    - "output/postprocess_report.jsonl"
    - "filtered/*.TextGrid"
