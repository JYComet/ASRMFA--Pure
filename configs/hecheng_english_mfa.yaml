# 新版合成英文数据 — ASR + MFA 对齐 (参考文本模式, 支持八卡并行)
#
# ═══════════════════════════════════════════════════════════════════════════
# 准备 (只需执行一次):
#   # 生成 .lab / _text_cn.txt / {stem}.txt 参考文本
#   python scripts/prepare_english_tts.py \
#       --jsonl /mnt/project/Voxcpm/output/generated_scripts.jsonl \
#       --audio-root /mnt/Raw/新版合成英文数据 \
#       --output-dir output/hecheng_en_mfa/ctc_pretg \
#       --write-ref-txt
#
# ═══════════════════════════════════════════════════════════════════════════
# 单卡运行:
#   python scripts/run_pipeline.py --config configs/hecheng_english_mfa.yaml \
#       --workspace /mnt/project/MFA_Pause/repo/output/hecheng_en_mfa \
#       --skip-normalize_punct --skip-normalize \
#       --skip-normalize_ria --skip-normalize_en --skip-adjust \
#       --python /home/devuser/miniconda3/envs/mfa_chinese/bin/python3 \
#       --overwrite --force
#
# ═══════════════════════════════════════════════════════════════════════════
# 八卡并行 (自动切分 54000 stems → 8×6750, 每 GPU 独立运行):
#   python scripts/launch_8gpu.py --dry-run          # 预览分片
#   python scripts/launch_8gpu.py                    # 启动八卡
#   python scripts/launch_8gpu.py --gpus 0,1,2,3     # 只用前四卡
#   python scripts/launch_8gpu.py --total-stems 40   # 测试 40 条
#
# ═══════════════════════════════════════════════════════════════════════════
# 说明:
#   - ASR 参考文本模式: ctc_prealign.py 自动查找 {stem}.txt 做 forced alignment
#   - 无参考文本时回退到 NVASR 自由解码
#   - 八卡模式下, launch_8gpu.py 自动生成 per-GPU 配置 (ctc_prealign.offset/limit)
#   - 每 GPU 处理不重叠的 stem 区间, 输出汇入同一 NAS 目录
#   - 输入: /mnt/Raw/新版合成英文数据/{ria,花礼,雪狐桑}/
#   - 输出: /mnt/Raw/新版合成英文数据对齐/

mode: nvrasr_fallback
workspace: hecheng_en_mfa

# 输入: 三个子目录下的合成音频
data_dir: /mnt/Raw/新版合成英文数据

# 保留 16k 音频
keep_16k_audio: true

# ── CTC/ASR 预处理: 启用 (参考文本模式) ──
# 有参考文本 ({stem}.txt) → CTC forced alignment 生成字符级锚点
# 无参考文本 → 回退到 ASR 解码文本
ctc_prealign:
  enabled: true
  model_path: /mnt/local_E/nvvasr_standalone/models/Multilingual-NVASR
  device: cuda:0
  python: /home/user/miniconda3/envs/asr/bin/python
  limit: 5
  timeout: 3600

ctc_adjust:
  enabled: false

# MFA 模型目录 (必须本地路径, CIFS 上 SQLite 锁死)
models_dir: /tmp/mfa_root

# MFA 中文对齐
mfa:
  num_jobs: 32
  single_speaker: true
  output_format: long_textgrid
  clean: false
  no_tokenization: true
  skip_validate: true
  fine_tune: false
  beam: 20
  retry_beam: 80

# 英文 MFA 子词对齐
mfa_en:
  enabled: true
  num_jobs: 4
  padding_ms: 50
  min_segment_dur_ms: 200
  max_gap_merge_s: 0.35
  beam: 10
  retry_beam: 40
  fine_tune: false
  acoustic_model: /mnt/local_E/MFA_Pause/pretrained_models/acoustic/english_us_arpa.zip
  dictionary: dict/cmudict.dict
  g2p_model: /mnt/local_E/MFA_Pause/pretrained_models/g2p/english_us_arpa.zip

# 后处理 (关闭过滤 — 无 ASR CTC 时英文词 OOV 会导致过度过滤)
postprocess:
  merge_silence: true
  min_sil_merge_sec: 0.2
  fix_short_word: true
  detect_bgm: false
  filter_suspicious: false
  enable_text_correction: true
  handle_unexpected_sil: true

# MFA 临时目录 (使用本地路径避免 CIFS SQLite 锁死)
temp_dir: /tmp/mfa_temp

# 静音补全
pad_silence:
  target_edge_silence_sec: 0.5

# 输出到 NAS
output_dir: /mnt/Raw/新版合成英文数据对齐
