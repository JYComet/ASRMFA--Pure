# 批量处理 ASRNEW 下全部数据集
# 正式运行（推荐的单一批量资源计划）:
#   python scripts/streaming_pipeline.py --config configs/batch_all.yaml --pipelined
# 兼容启动器:
#   bash scripts/launch_multi_gpu.sh --config configs/batch_all.yaml --streaming --pipelined
#
# 自动发现 ASRNEW/{数据集}/wavs/ 下有CTC的所有数据集
# 对应音频在 v5_0707/{数据集}/wavs/
# 输出到 ASR_MFA/{数据集}/
#
# 预扫描缓存: python scripts/run_pipeline.py --config configs/batch_all.yaml --scan-only
# 使用缓存:   默认自动启用（use_cache: true），--no-cache 强制重扫

mode: batch_ctc_ready

# 扫描缓存 (默认 true，缓存文件在 cache/ 目录)
use_cache: true

# 流式管线默认值（命令行优先；GPU/CPU/MFA 请求都会由资源规划器按主机预算限制）
streaming:
  # 本地 NVMe 工作目录 — 单盘模式
  local_work: /mnt/nvme0/mfa_work
  # 多盘模式 (取消注释下面以使用所有 4 块 NVMe，每盘承载 parallel/4 个 worker):
  # local_work:
  #   - /mnt/nvme0/mfa_work
  #   - /mnt/nvme1/mfa_work
  #   - /mnt/nvme2/mfa_work
  #   - /mnt/nvme3/mfa_work
  batch_size: 2000              # 每批 stem 数量 (减少进程启动开销)
  num_gpus: 0                   # 0 = 自动检测；可用 CLI --gpus 覆写
  parallel: 4                   # 仅普通（非 pipelined）批量路径的数据集并发数
  prefetch_buffer: 4            # 有界 GPU 队列 / 本地 NVMe 预取容量
  upload_buffer: 4              # 有界 CPU/upload 队列；慢 NAS 时提供反压
  batch_cache: cache/batch_all.cache.json  # 批量缓存 (不写则自动从 config 名推导)

# pipelined GPU/CPU 分阶段模式的 CPU worker 请求值；0 = 自动（CPU 数 // 8）。
pipelined:
  cpu_workers: 0

batch:
  ctc_root: \\RS3621\Research_TTS\Data\Raw\ASRNEW
  audio_root: \\RS3621\Research_TTS\Data\Raw\v5_0707
  output_root: \\RS3621\Research_TTS\Data\Raw\ASR_MFA
  # include: [合成ria, BCNbanma]  # 可选：只处理指定数据集
  # exclude: [test]                # 可选：排除指定数据集
  # limit: 5                       # 可选：只处理前N个（测试用）

ctc_ready:
  require_all: true

mfa:
  num_jobs: 64                   # 每个 CPU worker 的请求值；资源规划器按 CPU 预算截断
  single_speaker: true

postprocess:
  filter_suspicious: true
  enable_text_correction: true
  handle_unexpected_sil: true
