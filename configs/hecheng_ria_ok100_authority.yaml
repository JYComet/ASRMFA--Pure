audio_axis:
  mfa_axis_role: mfa_axis_audio
  tts_authoritative_role: tts_authoritative_audio
  reuse_ctc_requires_receipt: true
  post_ctc_pad_silence: forbidden

pad_silence:
  enabled: false

mfa:
  num_jobs: 16
  single_speaker: true
  output_format: long_textgrid
  clean: false
  no_tokenization: true
  skip_validate: true
  fine_tune: false
  beam: 20
  retry_beam: 80
  allow_partial: true
  min_output_ratio: 0.99

mfa_en:
  enabled: true
  strict_provenance: true
  num_jobs: 4
  padding_ms: 50
  min_segment_dur_ms: 150
  max_gap_merge_s: 0.35
  beam: 10
  retry_beam: 40
  fine_tune: false
  acoustic_model: /mnt/local_E/MFA_Pause/pretrained_models/acoustic/english_us_arpa.zip
  dictionary: dict/cmudict.dict
  g2p_model: /mnt/local_E/MFA_Pause/pretrained_models/g2p/english_us_arpa.zip

postprocess:
  strict_ok: true
  allow_filtered_integrity_failures: true
  merge_silence: true
  # Use the same final visual energy-owner policy for <sp0> and <sp1>.
  min_sil_merge_sec: 0.5
  fix_short_word: false
  detect_bgm: false
  filter_suspicious: true
  enable_word_in_silence_filter: true
  enable_text_correction: true
  handle_unexpected_sil: false
