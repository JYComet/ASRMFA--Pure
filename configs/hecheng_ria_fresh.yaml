# 新版合成数据 — 3 speaker 全量 54,000 条 (参考文本模式 + 全流程)
# 2026-08-07 fresh workspace, 避免旧 0805 工作区污染
#
# 数据: /mnt/nvme3/mfa_audio_cache_ria/{ria,花礼,雪狐桑}
#   每个子目录 = 一个 speaker, flat 布局 WAV + .txt
#
# 运行:
#   python3 scripts/run_pipeline.py \
#       --config configs/hecheng_ria_fresh.yaml \
#       --python /home/user/miniconda3/envs/mfa-dev/bin/python

mode: nvrasr_fallback

# ── 路径配置 ──────────────────────────────────────────────────

# 输入: 父目录, 管线自动发现子目录 (ria/花礼/雪狐桑) 下的 WAV + .txt
data_dir: /mnt/nvme3/mfa_audio_cache_ria

# 新工作目录 (避免旧 0805 的 cn2an 污染)
workspace: /mnt/nvme3/mfa_workspace_54k_fresh

# 最终输出
output_dir: /mnt/Raw/54k_fresh

# 输出暂存: postprocess 先写 NVMe，完成后 rsync 到 NAS
output_staging: true

# 保留 16k 音频
keep_16k_audio: true

# MFA 临时目录：必须随 run workspace 隔离，避免并发任务串用旧 Kaldi 数据库
temp_dir: temp

# ── 静音补全 ──────────────────────────────────────────────────
pad_silence:
  target_edge_silence_sec: 0.5

# ── CTC/ASR 预对齐 (参考文本模式) ────────────────────────────
ctc_prealign:
  enabled: true
  python: /home/user/miniconda3/envs/asr/bin/python
  model_path: /mnt/local_E/nvvasr_standalone/models/Multilingual-NVASR
  device: cuda:0
  all_gpus: true
  limit: 0
  timeout: 14400
  # Audio-side NVV discovery is optional; reference NVV labels are always
  # preserved in the canonical sidecars and are independent of this switch.
  nvv_enabled: false
  reference_nvv_enabled: true

# ── CTC 边界能量修正 ─────────────────────────────────────────
ctc_adjust:
  enabled: false

# ── MFA 模型目录 ──────────────────────────────────────────────
models_dir: /mnt/local_E/MFA_Pause/repo/models/mfa

# ── MFA 中文对齐 ──────────────────────────────────────────────
mfa:
  num_jobs: 64
  single_speaker: true
  output_format: long_textgrid
  clean: false
  no_tokenization: true
  skip_validate: true
  fine_tune: false
  beam: 20
  retry_beam: 80
  # MFA may fail to emit a TextGrid for a small number of utterances.
  # Keep those stems explicitly rejected and continue with valid output.
  allow_partial: true
  min_output_ratio: 0.54
  timeout: 7200

# ── MFA 英文对齐 ──────────────────────────────────────────────
mfa_en:
  enabled: true
  num_jobs: 16
  padding_ms: 50
  min_segment_dur_ms: 200
  max_gap_merge_s: 0.35
  beam: 10
  retry_beam: 40
  fine_tune: false
  acoustic_model: /mnt/local_E/MFA_Pause/pretrained_models/acoustic/english_us_arpa.zip
  dictionary: dict/cmudict.dict
  g2p_model: /mnt/local_E/MFA_Pause/pretrained_models/g2p/english_us_arpa.zip

# ── 后处理 ────────────────────────────────────────────────────
postprocess:
  strict_ok: true
  allow_filtered_integrity_failures: true
  merge_silence: true
  min_sil_merge_sec: 0.2
  fix_short_word: false
  detect_bgm: false
  filter_suspicious: false
  enable_text_correction: true
  handle_unexpected_sil: false
