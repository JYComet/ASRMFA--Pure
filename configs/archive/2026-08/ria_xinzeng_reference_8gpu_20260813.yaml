# 新版合成英文数据 / ria新增/ria
# 参考文本模式：WAV 与同名 .txt 在同一目录；运行前先完整复制到 NVMe。
#
# NAS 源目录（仅作来源记录）：
#   \\RS3621\Research_TTS\Data\Raw\新版合成英文数据\ria新增\ria
# NVMe 输入目录（本配置实际读取此路径）：
#   /mnt/nvme3/mfa_audio_cache_ria_new_20260813/ria
#
# 当前仅创建配置和 NVMe 输入目录，不启动管线。
# 待音频与文本完整上传、核对数量/同名关系且确认输出挂载可写后再运行：
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 python3 scripts/run_pipeline.py \
#       --config configs/ria_xinzeng_reference_8gpu_20260813.yaml \
#       --python /home/user/miniconda3/envs/mfa-dev/bin/python
#
# ctc_prealign.all_gpus=true 会让 CTC 阶段使用可见的 8 张 GPU；后续 MFA 使用本机
# NVMe workspace，不把逐文件中间产物直接写到 CIFS。

mode: nvrasr_fallback
# Explicitly reference-authoritative: a missing reference is an error.
reference_mode: authority

# 输入：完整上传后的 NVMe 目录，WAV 和同名参考文本 .txt 共存
data_dir: /mnt/nvme3/mfa_audio_cache_ria_new_20260813/ria

# 本次独立工作区，避免复用旧 ria 工作区或 CTC 结果
workspace: /mnt/nvme3/mfa_workspace_ria_xinzeng_20260813
output_dir: /mnt/Raw/新版合成英文数据对齐/ria新增/ria
output_staging: true
keep_16k_audio: true
# Keep temporary artifacts relative to the selected workspace so reruns can use
# a fresh isolated workspace without sharing stale MFA/English intermediates.
temp_dir: temp

# 音频是否已补全未知；沿用前一份 ria 参考文本配置，运行时只在工作区生成补全视图，
# 不原地修改 NVMe 输入文件。
pad_silence:
  enabled: true
  target_edge_silence_sec: 0.5
  output_audio: false

# 参考文本模式：缺少同名 .txt 时失败，不回退到无参考 ASR 文本。
ctc_prealign:
  enabled: true
  python: /home/user/miniconda3/envs/asr/bin/python
  model_path: /mnt/local_E/nvvasr_standalone/models/Multilingual-NVASR
  device: cuda:0
  all_gpus: true
  limit: 0
  timeout: 14400
  nvv_enabled: false
  reference_nvv_enabled: true
  allow_missing_reference: false

# 沿用前一份 ria 配置；参考文本模式先不启用 CTC 能量二次修正。
ctc_adjust:
  enabled: false

models_dir: /mnt/local_E/MFA_Pause/repo/models/mfa

mfa:
  num_jobs: 64
  single_speaker: true
  output_format: long_textgrid
  clean: false
  no_tokenization: true
  skip_validate: true
  fine_tune: false
  beam: 20
  retry_beam: 80
  allow_partial: true
  min_output_ratio: 0.90
  timeout: 7200

mfa_en:
  enabled: true
  num_jobs: 16
  padding_ms: 50
  min_segment_dur_ms: 200
  max_gap_merge_s: 0.35
  beam: 10
  retry_beam: 40
  fine_tune: false
  strict_provenance: true
  acoustic_model: /mnt/local_E/MFA_Pause/pretrained_models/acoustic/english_us_arpa.zip
  dictionary: dict/cmudict.dict
  g2p_model: /mnt/local_E/MFA_Pause/pretrained_models/g2p/english_us_arpa.zip

postprocess:
  strict_ok: true
  # Isolate mandatory-integrity failures in filtered/ and let the independent
  # strict_ok auditor decide the publication set.  Filtered candidates are
  # never published.
  allow_filtered_integrity_failures: true
  merge_silence: true
  min_sil_merge_sec: 0.2
  fix_short_word: false
  detect_bgm: false
  filter_suspicious: false
  enable_text_correction: true
  handle_unexpected_sil: false
